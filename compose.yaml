services:
  control:
    image: ${TPROXY_CONTROL_IMAGE:-teleproxy/control:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TPROXY_HTTP_ADDR: 0.0.0.0:8080
      TPROXY_DATABASE_PATH: /var/lib/teleproxy/teleproxy.db
      TPROXY_BOOTSTRAP_ADMIN_USER: ${TPROXY_ADMIN_USER:-admin}
      TPROXY_BOOTSTRAP_PASSWORD_FILE: /run/teleproxy-secrets/admin-bootstrap-password
      TPROXY_COOKIE_SECURE: ${TPROXY_COOKIE_SECURE:-false}
      TPROXY_TELEMT_API_URL: http://telemt:9091
      TPROXY_TELEMT_API_TOKEN_FILE: /run/teleproxy-secrets/telemt-api-token
      TPROXY_RECONCILE_CONCURRENCY: ${TPROXY_RECONCILE_CONCURRENCY:-2}
      TPROXY_BOT_TOKEN_FILE: ${TPROXY_BOT_TOKEN_FILE:-}
      TPROXY_BOT_WEBHOOK_SECRET_FILE: ${TPROXY_BOT_WEBHOOK_SECRET_FILE:-}
      TPROXY_BOT_USERNAME: ${TPROXY_BOT_USERNAME:-}
    ports:
      - "${TPROXY_PANEL_BIND:-0.0.0.0}:${TPROXY_PANEL_PORT:?panel port required}:8080"
    volumes:
      - "${TPROXY_DATA_DIR:?data dir required}:/var/lib/teleproxy"
      - "${TPROXY_SECRETS_DIR:?secrets dir required}:/run/teleproxy-secrets:ro"
      - "${TPROXY_SECRETS_DIR:?secrets dir required}/bot-runtime:/run/teleproxy-bot-secrets"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - teleproxy

  telemt:
    image: ${TPROXY_TELEMT_IMAGE:-teleproxy/telemt:3.5.7}
    build:
      context: .
      dockerfile: docker/telemt/Dockerfile
      args:
        TELEMT_VERSION: 3.5.7
    restart: unless-stopped
    ports:
      - "${TPROXY_PROXY_BIND:-0.0.0.0}:${TPROXY_PROXY_PORT:-443}:8443"
    volumes:
      - "${TPROXY_PROXY_DATA_DIR:?proxy data dir required}:/var/lib/telemt"
      - "${TPROXY_TELEMT_CONFIG:?telemt config required}:/etc/telemt/config.toml:ro"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - teleproxy

networks:
  teleproxy:
    driver: bridge
