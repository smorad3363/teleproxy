name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  installer:
    needs: go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck install.sh scripts/install_lib.sh scripts/install-host.sh bin/tproxy tests/installer_lib_test.sh tests/installer_e2e.sh

      - name: Installer syntax and unit tests
        run: |
          bash -n install.sh scripts/install_lib.sh scripts/install-host.sh bin/tproxy tests/installer_lib_test.sh tests/installer_e2e.sh
          bash tests/installer_lib_test.sh

      - name: Docker prerequisites
        run: |
          docker version
          docker compose version

      - name: End-to-end install, Telemt API isolation, and rerun
        run: bash tests/installer_e2e.sh
